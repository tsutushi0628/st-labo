name: LP 未掲載の note 記事チェック

on:
  schedule:
    - cron: '17 0 * * 1' # 毎週月曜 9:17 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 未掲載の記事を洗い出す
        id: check
        run: |
          node tools/check-updates.mjs --note-only > report.md
          cat report.md
          echo "count=$(grep -oE 'NEW_COUNT=[0-9]+' report.md | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Issue で知らせる（同じタイトルの Issue が開いていれば作らない）
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="LP に未掲載の note 記事があります"
          if [ -z "$(gh issue list --state open --search "in:title $title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body-file report.md
          fi
