name: LP 未掲載の note 記事チェック

on:
  schedule:
    - cron: '17 0 * * 1' # 毎週月曜 9:17 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 未掲載の記事を洗い出す
        id: check
        run: |
          node tools/check-updates.mjs --note-only > report.md
          cat report.md
          count=$(grep -oE '^NEW_COUNT=[0-9]+$' report.md | cut -d= -f2)
          if [ -z "$count" ]; then echo "NEW_COUNT が出力にない" >&2; exit 1; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Issue で知らせる（同じタイトルの Issue が開いていればコメントで追記）
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: LP に未掲載の note 記事があります
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
